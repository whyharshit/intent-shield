# Warrant category taxonomy — Indian retail
#
# Consumed by:
#   C3 deterministic checker  — categories_allowed / categories_denied set membership
#   C4 stage 1 category map   — `description` seeds the embedding centroid,
#                               `keywords` drives the regex fast path
#
# Leaf ids are the constraint vocabulary. They are stable identifiers: once a
# mandate is signed against a leaf id, renaming it silently changes what that
# mandate means. Add leaves freely; never rename or delete one.
#
# `restricted: true` marks categories that are age-gated or regulated in India.
# A mandate that does not explicitly allow a restricted leaf never gets ALLOW —
# the strongest verdict available is ESCALATE. See DECISIONS.md.

